name: Build preview

# Test builds of any branch, started by hand: Actions tab > Build preview > Run workflow.
# The APKs are published as a pre-release named preview-<branch>.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # With the keystore secrets set, every build is signed with the same key, so new APKs
      # install over old ones.
      - name: Use the stable signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.GLINT_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/glint.jks"
            echo "GLINT_KEYSTORE_PATH=$RUNNER_TEMP/glint.jks" >> "$GITHUB_ENV"
            echo "Signing with the stable key."
          else
            echo "::warning::No keystore secret: these APKs use a new debug key and cannot update an earlier install."
          fi

      - name: Build, test and lint
        env:
          GLINT_KEYSTORE_PASSWORD: ${{ secrets.GLINT_KEYSTORE_PASSWORD }}
        run: |
          set -o pipefail
          ./gradlew --no-daemon -Pglint.versionSuffix=-preview \
            :app:assembleRelease :app:testReleaseUnitTest :app:lintRelease 2>&1 | tee "$RUNNER_TEMP/build.log"

      # Compiler, test and lint errors as one annotation, readable without downloading the log.
      - name: Report build errors
        if: failure()
        run: |
          log="$RUNNER_TEMP/build.log"
          [ -f "$log" ] || exit 0
          errors=$(grep -E "^e: |: error: |Error: |FAILED|What went wrong|Caused by|AssertionError|expected:" "$log" | grep -v "^> Task" | head -80)
          [ -n "$errors" ] || errors=$(tail -60 "$log")
          errors="${errors//'%'/'%25'}"
          errors="${errors//$'\r'/'%0D'}"
          errors="${errors//$'\n'/'%0A'}"
          echo "::error title=Build failed::$errors"

      - name: Publish APKs as a pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          # Releases do not count against the Actions artifact storage quota.
          tag="preview-$(printf '%s' "$BRANCH" | tr -c 'A-Za-z0-9._-' '-')"
          mkdir -p out
          for apk in app/build/outputs/apk/release/app-*-release.apk; do
            abi=$(basename "$apk" | sed -e 's/^app-//' -e 's/-release\.apk$//')
            cp "$apk" "out/Glint-preview-$abi.apk"
          done
          gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$tag" out/*.apk \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Glint preview (${BRANCH})" \
            --notes "Test build of ${GITHUB_SHA} from ${BRANCH}. Most phones need the arm64-v8a APK."
          printf 'APKs: https://github.com/%s/releases/tag/%s\n' "$GH_REPO" "$tag" >> "$GITHUB_STEP_SUMMARY"
