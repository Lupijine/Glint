name: Release

# Publishes a release when a version tag is pushed, for example:
#   git tag v0.9.0 && git push origin v0.9.0
# The tag must match versionName in app/build.gradle.kts, and the release notes come from
# fastlane/metadata/android/en-US/changelogs/<versionCode>.txt.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Read the version
        id: version
        run: |
          name=$(sed -n 's/^ *versionName = "\(.*\)"$/\1/p' app/build.gradle.kts)
          code=$(sed -n 's/^ *versionCode = \([0-9]*\)$/\1/p' app/build.gradle.kts)
          if [ "v$name" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match versionName $name in app/build.gradle.kts."
            exit 1
          fi
          notes="fastlane/metadata/android/en-US/changelogs/$code.txt"
          if [ ! -s "$notes" ]; then
            echo "::error::Write the release notes in $notes first."
            exit 1
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "notes=$notes" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Releases must be signed with the stable key; a debug-signed release could never update.
      - name: Use the stable signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.GLINT_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::The keystore secret is missing, so this release cannot be signed with the stable key."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/glint.jks"
          echo "GLINT_KEYSTORE_PATH=$RUNNER_TEMP/glint.jks" >> "$GITHUB_ENV"

      - name: Build, test and lint
        env:
          GLINT_KEYSTORE_PASSWORD: ${{ secrets.GLINT_KEYSTORE_PASSWORD }}
        run: ./gradlew --no-daemon :app:assembleRelease :app:testReleaseUnitTest :app:lintRelease

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.version.outputs.name }}
          NOTES: ${{ steps.version.outputs.notes }}
        run: |
          mkdir -p out
          for apk in app/build/outputs/apk/release/app-*-release.apk; do
            abi=$(basename "$apk" | sed -e 's/^app-//' -e 's/-release\.apk$//')
            cp "$apk" "out/Glint-$VERSION-$abi.apk"
          done
          apksigner="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          cert=$("$apksigner" verify --print-certs out/Glint-$VERSION-universal.apk | sed -n 's/.*certificate SHA-256 digest: //p' | head -1)
          {
            cat "$NOTES"
            echo
            echo "### Which APK?"
            echo
            echo "- **arm64-v8a**: almost every phone from the last several years"
            echo "- **armeabi-v7a**: older and low-cost phones running 32-bit Android"
            echo "- **x86_64**: emulators and Intel/AMD Chromebooks"
            echo "- **universal**: works everywhere, but is the largest download"
            echo
            echo "Signing certificate SHA-256: \`$cert\`"
          } > out/notes.md
          gh release create "$GITHUB_REF_NAME" out/*.apk \
            --verify-tag \
            --title "Glint $VERSION" \
            --notes-file out/notes.md
